<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>DEV — póló-preview (nem deployolódik, nincs a dist-whitelistben)</title>
    <style>
        body { background: #08081A; color: #ECF0F1; font-family: Outfit, Arial, sans-serif; margin: 0; padding: 16px; }
        h1 { font-size: 18px; }
        .grid { display: flex; flex-wrap: wrap; gap: 12px; }
        figure { margin: 0; text-align: center; font-size: 12px; color: #95A5A6; }
        canvas { background: rgba(255,255,255,0.04); border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Dorko-pólók — front-nézet dev preview</h1>
    <div class="grid" id="grid"></div>
    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { SKINS, makeShirtTexture } from './js/skins.js';
        import { createSnackyModel, createShirtMesh } from './js/models.js';

        const grid = document.getElementById('grid');
        const renders = [];
        const mkView = (model, back) => {
            const canvas = document.createElement('canvas');
            canvas.width = 190; canvas.height = 190;
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(190, 190, false);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
            camera.position.set(0, 1.05, back ? 3.4 : -3.4); // -z = szemből, +z = hátulról
            camera.lookAt(0, 0.78, 0);
            scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x2A2A3A, 1.15));
            const key = new THREE.DirectionalLight(0xFFFFFF, 1.3);
            key.position.set(back ? 2 : -2, 3, back ? 3 : -3);
            scene.add(key);
            scene.add(model.group);
            renders.push(() => renderer.render(scene, camera));
            return canvas;
        };
        for (const skin of [{ id: null, short: 'ALAP', threshold: 0 }, ...SKINS]) {
            const fig = document.createElement('figure');
            const cap = document.createElement('figcaption');
            cap.textContent = skin.id ? `${skin.short} (${skin.threshold})` : skin.short;
            for (const back of [false, true]) {
                const model = createSnackyModel();
                if (!back) model.parts.headGroup.rotation.y = 0; // front: egyenesen a kamerába
                if (skin.id) model.group.add(createShirtMesh(makeShirtTexture(skin)));
                fig.appendChild(mkView(model, back));
            }
            fig.appendChild(cap);
            grid.appendChild(fig);
        }
        // a textúrák aszinkron töltenek — rendereljük újra, amíg be nem jönnek
        const renderAll = () => renders.forEach((r) => r());
        renderAll();
        THREE.DefaultLoadingManager.onLoad = renderAll;
        setTimeout(renderAll, 800);
        setTimeout(renderAll, 2000);
    </script>
</body>
</html>
